# IFT3913 task 3: reusable action that rickrolls the author of a failing test.
name: Rickroll failing tests
description: >
  Reads the JUnit XML reports written by Surefire and Failsafe and, if a test failed,
  rickrolls the run: error annotations, a summary that links to the video, and the list
  of failing tests.
inputs:
  reports:
    description: Space-separated glob patterns of the JUnit XML reports to read
    required: false
    default: '**/target/surefire-reports/TEST-*.xml **/target/failsafe-reports/TEST-*.xml'
  video-id:
    description: YouTube id of the video
    required: false
    default: dQw4w9WgXcQ
outputs:
  failed-tests:
    description: Number of failing tests found in the reports
    value: ${{ steps.rickroll.outputs.failed-tests }}
runs:
  using: composite
  steps:
    - id: rickroll
      shell: bash
      env:
        REPORTS: ${{ inputs.reports }}
        VIDEO_ID: ${{ inputs.video-id }}
      run: python3 "$GITHUB_ACTION_PATH/rickroll.py"

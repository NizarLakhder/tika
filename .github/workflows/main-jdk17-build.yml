name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  # IFT3913 task 3: the build only starts if the commit does not add a Semgrep finding.
  # Findings that already exist in the baseline commit are ignored.
  semgrep:
    name: semgrep (new findings only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install Semgrep
        run: pipx install semgrep==1.185.0
      - name: Find the baseline commit
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          # new branch or force push: the commit before the push is unknown, use the parent
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Baseline commit: $base"
      - name: Scan with Semgrep, fail on new findings
        env:
          BASELINE: ${{ steps.baseline.outputs.sha }}
        run: |
          semgrep scan --config p/default --config p/java --metrics=off \
            --baseline-commit "$BASELINE" --error \
            --json-output=semgrep-new.json --sarif-output=semgrep-new.sarif
      - name: Report new findings
        if: always()
        env:
          BASELINE: ${{ steps.baseline.outputs.sha }}
        run: |
          [ -f semgrep-new.json ] || exit 0
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line),title=Semgrep \(.check_id | split(".") | last)::\(.extra.message | gsub("%"; "%25") | gsub("\n"; " "))"' semgrep-new.json
          {
            echo "## Semgrep: new findings since ${BASELINE:0:7}"
            if [ "$(jq '.results | length' semgrep-new.json)" -eq 0 ]; then
              echo "No new finding."
            else
              echo "| Rule | File | Line | Severity |"
              echo "|---|---|---|---|"
              jq -r '.results[] | "| `\(.check_id | split(".") | last)` | `\(.path)` | \(.start.line) | \(.extra.severity) |"' semgrep-new.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Semgrep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-new-findings
          path: semgrep-new.*
          if-no-files-found: ignore

  build:
    needs: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        id: maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      # IFT3913 task 3
      - name: Rickroll
        if: failure() && steps.maven.outcome == 'failure'
        uses: ./.github/actions/rickroll

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        id: maven
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      # IFT3913 task 3
      - name: Rickroll
        if: failure() && steps.maven.outcome == 'failure'
        uses: ./.github/actions/rickroll
